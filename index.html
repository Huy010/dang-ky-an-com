<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Đăng Ký Cơm Công Ty</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fafafa;
            --border-color: #e5e7eb;
            --border-dark: #111827;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header-box {
            border-bottom: 2px solid var(--border-dark);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .control-panel {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            display: block;
        }

        .form-control-custom, .form-select-custom {
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: none !important;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            border-color: var(--border-dark);
        }

        .calendar-wrapper {
            background: #ffffff;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border-color);
            background-color: #f9fafb;
        }

        .day-label {
            padding: 0.75rem 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-right: 1px solid var(--border-color);
        }

        .day-label:last-child {
            border-right: none;
        }

        .calendar-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-cell {
            min-height: 105px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #ffffff;
            user-select: none;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell.other-month {
            background-color: #fcfcfc;
            color: #d1d5db;
            cursor: default;
        }

        .calendar-cell.active-day {
            cursor: pointer;
        }

        .calendar-cell.active-day:hover {
            background-color: #f9fafb;
        }

        .calendar-cell.weekend {
            background-color: #fafafa;
        }

        .calendar-cell.registered {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .today-badge {
            font-size: 0.65rem;
            font-weight: 700;
            background: #000;
            color: #fff;
            padding: 2px 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .calendar-cell.registered .today-badge {
            background: #fff;
            color: #000;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: auto;
            text-align: right;
        }

        .registered .status-badge {
            color: #ffffff;
            font-weight: 600;
        }

        .unregistered .status-badge {
            color: var(--text-muted);
        }

        .btn-custom {
            border-radius: 0;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.15s ease;
        }

        .btn-dark-custom {
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
        }

        .btn-dark-custom:hover {
            background: #222222;
            color: #ffffff;
        }

        .btn-outline-custom {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline-custom:hover {
            background: #f3f4f6;
            border-color: var(--border-dark);
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid var(--border-dark);
            padding: 1.25rem;
        }

        .summary-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-value {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .summary-total {
            font-size: 1.75rem;
            font-weight: 800;
            color: #000000;
        }

        .history-table {
            border: 1px solid var(--border-color);
            background: #fff;
            width: 100%;
            font-size: 0.85rem;
        }

        .history-table th, .history-table td {
            padding: 0.65rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .history-table th {
            background: #f9fafb;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        @media (max-width: 768px) {
            .calendar-cell {
                min-height: 80px;
                padding: 0.35rem;
            }
            .day-number {
                font-size: 0.85rem;
            }
            .status-badge {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-box d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h1 class="app-title m-0"><i class="fa-solid fa-utensils me-2"></i>Nhật Ký Đăng Ký Cơm</h1>
            <p class="text-muted small m-0 mt-1">Hệ thống ghi nhận và quản lý chi phí cơm công ty</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-custom btn-custom" onclick="exportData()"><i class="fa-solid fa-download me-1"></i>Xuất File</button>
            <label class="btn btn-outline-custom btn-custom mb-0" style="cursor:pointer;">
                <i class="fa-solid fa-upload me-1"></i>Nhập File
                <input type="file" id="importInput" accept=".json" onchange="importData(event)" hidden>
            </label>
        </div>
    </div>

    <div class="control-panel">
        <div class="row g-3 align-items-end">
            <div class="col-md-3 col-6">
                <label class="form-label-custom">Tháng</label>
                <select id="monthSelect" class="form-select form-select-custom" onchange="renderCalendar()">
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label-custom">Năm</label>
                <select id="yearSelect" class="form-select form-select-custom" onchange="renderCalendar()">
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label-custom">Giá Cơm / Suất (VNĐ)</label>
                <input type="number" id="priceInput" class="form-control form-control-custom" value="35000" step="1000" onchange="savePriceAndRender()">
            </div>
            <div class="col-md-3 col-6 d-flex gap-1">
                <button class="btn btn-dark-custom btn-custom w-100" onclick="quickSelectWeekdays()"><i class="fa-solid fa-check-double me-1"></i>T2-T6</button>
                <button class="btn btn-outline-custom btn-custom w-100" onclick="clearAllMonth()"><i class="fa-solid fa-trash-can me-1"></i>Xóa</button>
            </div>
        </div>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-header">
            <div class="day-label">T2</div>
            <div class="day-label">T3</div>
            <div class="day-label">T4</div>
            <div class="day-label">T5</div>
            <div class="day-label">T6</div>
            <div class="day-label text-danger">T7</div>
            <div class="day-label text-danger">CN</div>
        </div>
        <div class="calendar-body" id="calendarBody">
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="summary-card text-center">
                <div class="summary-title">Số Ngày Trong Tháng</div>
                <div class="summary-value" id="daysInMonthVal">0</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="summary-card text-center">
                <div class="summary-title">Đã Đăng Ký</div>
                <div class="summary-value" id="registeredDaysVal">0 suất</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="summary-card text-center">
                <div class="summary-title">Đơn Giá Suất</div>
                <div class="summary-value" id="unitPriceVal">0 đ</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="summary-card text-center" style="border-width: 2px;">
                <div class="summary-title">Tổng Tiền Phải Trả</div>
                <div class="summary-total" id="totalAmountVal">0 đ</div>
            </div>
        </div>
    </div>

    <div class="control-panel mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="m-0 fw-bold text-uppercase" style="letter-spacing:0.05em;"><i class="fa-solid fa-chart-simple me-2"></i>Thống Kê Lịch Sử Cả Năm <span id="annualYearText"></span></h6>
        </div>
        <div class="table-responsive">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Tháng</th>
                        <th class="text-center">Số Suất Đăng Ký</th>
                        <th class="text-end">Đơn Giá Suất</th>
                        <th class="text-end">Tổng Tiền (VNĐ)</th>
                    </tr>
                </thead>
                <tbody id="annualTableBody">
                </tbody>
                <tfoot>
                    <tr class="fw-bold bg-light">
                        <td>TỔNG CẢ NĂM</td>
                        <td class="text-center" id="annualTotalDays">0 suất</td>
                        <td class="text-end">-</td>
                        <td class="text-end" id="annualTotalMoney">0 đ</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let mealPrice = 35000;

    function getRecords() {
        try {
            return JSON.parse(localStorage.getItem('meal_records')) || {};
        } catch(e) {
            return {};
        }
    }

    function saveRecords(records) {
        localStorage.setItem('meal_records', JSON.stringify(records));
    }

    function initApp() {
        const savedPrice = localStorage.getItem('meal_price');
        if (savedPrice) {
            mealPrice = parseInt(savedPrice, 10);
        }
        document.getElementById('priceInput').value = mealPrice;

        const monthSelect = document.getElementById('monthSelect');
        monthSelect.innerHTML = '';
        for (let i = 0; i < 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Tháng ${i + 1}`;
            if (i === currentMonth) opt.selected = true;
            monthSelect.appendChild(opt);
        }

        const yearSelect = document.getElementById('yearSelect');
        yearSelect.innerHTML = '';
        const startYear = currentYear - 3;
        const endYear = currentYear + 3;
        for (let y = startYear; y <= endYear; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = `Năm ${y}`;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        renderCalendar();
    }

    function savePriceAndRender() {
        const val = parseInt(document.getElementById('priceInput').value, 10);
        mealPrice = isNaN(val) ? 0 : val;
        localStorage.setItem('meal_price', mealPrice);
        renderCalendar();
    }

    function formatDateKey(year, month, day) {
        const m = String(month + 1).padStart(2, '0');
        const d = String(day).padStart(2, '0');
        return `\({year}-\){m}-${d}`;
    }

    function renderCalendar() {
        currentMonth = parseInt(document.getElementById('monthSelect').value, 10);
        currentYear = parseInt(document.getElementById('yearSelect').value, 10);

        const records = getRecords();
        const calendarBody = document.getElementById('calendarBody');
        calendarBody.innerHTML = '';

        const today = new Date();
        const todayStr = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

        const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
        const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0);
        const totalDays = lastDayOfMonth.getDate();

        let firstDayIndex = firstDayOfMonth.getDay() - 1;
        if (firstDayIndex === -1) firstDayIndex = 6;

        const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = firstDayIndex; i > 0; i--) {
            const prevDayNum = prevMonthLastDay - i + 1;
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `
                <div class="cell-header">
                    <span class="day-number">${prevDayNum}</span>
                </div>
                <div class="status-badge"> </div>
            `;
            calendarBody.appendChild(cell);
        }

        let registeredCount = 0;

        for (let day = 1; day <= totalDays; day++) {
            const dateStr = formatDateKey(currentYear, currentMonth, day);
            const isRegistered = !!records[dateStr];
            if (isRegistered) registeredCount++;

            const dateObj = new Date(currentYear, currentMonth, day);
            const dayOfWeek = dateObj.getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            const cell = document.createElement('div');
            let cellClasses = ['calendar-cell', 'active-day'];
            if (isWeekend) cellClasses.push('weekend');
            if (isRegistered) cellClasses.push('registered');
            else cellClasses.push('unregistered');

            cell.className = cellClasses.join(' ');
            
            const isToday = (dateStr === todayStr);

            cell.innerHTML = `
                <div class="cell-header">
                    <span class="day-number">${day}</span>
                    ${isToday ? '<span class="today-badge">Hôm nay</span>' : ''}
                </div>
                <div class="status-badge">
                    ${isRegistered ? '<i class="fa-solid fa-check me-1"></i>Đã Đăng Ký' : 'Trống'}
                </div>
            `;

            cell.onclick = () => toggleDay(dateStr);
            calendarBody.appendChild(cell);
        }

        const totalCellsSoFar = firstDayIndex + totalDays;
        const remainingCells = (7 - (totalCellsSoFar % 7)) % 7;
        for (let i = 1; i <= remainingCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `
                <div class="cell-header">
                    <span class="day-number">${i}</span>
                </div>
                <div class="status-badge"> </div>
            `;
            calendarBody.appendChild(cell);
        }

        document.getElementById('daysInMonthVal').textContent = totalDays;
        document.getElementById('registeredDaysVal').textContent = `${registeredCount} suất`;
        document.getElementById('unitPriceVal').textContent = `${mealPrice.toLocaleString('vi-VN')} đ`;
        const totalMoney = registeredCount * mealPrice;
        document.getElementById('totalAmountVal').textContent = `${totalMoney.toLocaleString('vi-VN')} đ`;

        renderAnnualSummary();
    }

    function toggleDay(dateStr) {
        const records = getRecords();
        records[dateStr] = !records[dateStr];
        saveRecords(records);
        renderCalendar();
    }

    function quickSelectWeekdays() {
        const records = getRecords();
        const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let day = 1; day <= lastDay; day++) {
            const dateObj = new Date(currentYear, currentMonth, day);
            const dow = dateObj.getDay();
            if (dow >= 1 && dow <= 5) {
                const dateStr = formatDateKey(currentYear, currentMonth, day);
                records[dateStr] = true;
            }
        }
        saveRecords(records);
        renderCalendar();
    }

    function clearAllMonth() {
        if (!confirm('Bạn có chắc chắn muốn xóa tất cả lượt đăng ký trong tháng này?')) return;
        const records = getRecords();
        const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let day = 1; day <= lastDay; day++) {
            const dateStr = formatDateKey(currentYear, currentMonth, day);
            delete records[dateStr];
        }
        saveRecords(records);
        renderCalendar();
    }

    function renderAnnualSummary() {
        document.getElementById('annualYearText').textContent = `(${currentYear})`;
        const records = getRecords();
        const tbody = document.getElementById('annualTableBody');
        tbody.innerHTML = '';

        let yearTotalDays = 0;
        let yearTotalMoney = 0;

        for (let m = 0; m < 12; m++) {
            const totalDaysInM = new Date(currentYear, m + 1, 0).getDate();
            let countM = 0;
            for (let d = 1; d <= totalDaysInM; d++) {
                const dateStr = formatDateKey(currentYear, m, d);
                if (records[dateStr]) countM++;
            }

            const monthMoney = countM * mealPrice;
            yearTotalDays += countM;
            yearTotalMoney += monthMoney;

            const tr = document.createElement('tr');
            if (m === currentMonth) {
                tr.style.fontWeight = 'bold';
                tr.style.backgroundColor = '#f3f4f6';
            }
            tr.innerHTML = `
                <td>Tháng ${m + 1}</td>
                <td class="text-center">${countM} suất</td>
                <td class="text-end">${mealPrice.toLocaleString('vi-VN')} đ</td>
                <td class="text-end">${monthMoney.toLocaleString('vi-VN')} đ</td>
            `;
            tbody.appendChild(tr);
        }

        document.getElementById('annualTotalDays').textContent = `${yearTotalDays} suất`;
        document.getElementById('annualTotalMoney').textContent = `${yearTotalMoney.toLocaleString('vi-VN')} đ`;
    }

    function exportData() {
        const data = {
            meal_price: mealPrice,
            meal_records: getRecords()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dang-ky-an-com-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.meal_records) saveRecords(data.meal_records);
                if (data.meal_price) {
                    localStorage.setItem('meal_price', data.meal_price);
                    mealPrice = data.meal_price;
                    document.getElementById('priceInput').value = mealPrice;
                }
                alert('Nhập dữ liệu thành công!');
                renderCalendar();
            } catch(err) {
                alert('File không hợp lệ!');
            }
        };
        reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
